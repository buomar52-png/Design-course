<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>واصبر نفسك — ليلي</title>
<style>
@font-face{font-family:"Orn";src:url(f/amiri-quran-arabic-400-normal.woff2);unicode-range:U+FD3E-FD3F,U+FDFA,U+FDFD}
@font-face{font-family:"PlexLat";src:url(f/plex-r.ttf);font-weight:400;unicode-range:U+0000-00FF}
@font-face{font-family:"PlexLat";src:url(f/plex-sb.ttf);font-weight:600 700;unicode-range:U+0000-00FF}
@font-face{font-family:"Plex";src:url(f/ibm-plex-sans-arabic-arabic-300-normal.woff2);font-weight:300}
@font-face{font-family:"Plex";src:url(f/ibm-plex-sans-arabic-arabic-400-normal.woff2);font-weight:400}
@font-face{font-family:"Plex";src:url(f/ibm-plex-sans-arabic-arabic-500-normal.woff2);font-weight:500}
@font-face{font-family:"Plex";src:url(f/ibm-plex-sans-arabic-arabic-600-normal.woff2);font-weight:600}
@font-face{font-family:"Plex";src:url(f/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}

:root{
  --bg:#0f1012; --bg2:#161719; --line:rgba(255,255,255,.045);
  --text:#eef0f2; --muted:#8b9198; --dim:#5b6067;
  --blue:#65bdd5; --lime:#c4e773; --soft:#c9cdd2; --olive:#232f09; --card:#1b1d20; --border:#2a2d31;
}
@page{size:1080px 1350px;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:"Orn","PlexLat","Plex",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}

.slide{
  width:1080px;height:1350px;position:relative;overflow:hidden;page-break-after:always;
  background:
    radial-gradient(ellipse 80% 60% at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%),
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/54px 54px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/54px 54px,
    var(--bg);
  display:flex;flex-direction:column;padding:120px 110px 0;
}
.slide:last-child{page-break-after:auto}

/* header */
.head{display:flex;align-items:center;gap:18px;font-size:28px;font-weight:500;color:var(--muted)}
.head::before{content:"";width:5px;height:40px;background:var(--blue);border-radius:3px}
.count{margin-inline-start:auto;font-size:24px;color:var(--dim);font-weight:400;letter-spacing:.04em}

.body{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:60px}

p.t{font-size:58px;line-height:1.75;font-weight:400;text-align:right}
p.t + p.t{margin-top:28px}
p.s{font-size:44px;line-height:1.8;font-weight:400;color:#c9cdd2}
b{font-weight:700;color:var(--blue)}
.lime{color:var(--lime);font-weight:700}

.tag{align-self:flex-start;display:inline-block;background:var(--olive);color:var(--lime);
  font-size:40px;font-weight:700;padding:10px 30px 16px;border-radius:12px;margin-bottom:56px}

.verse{text-align:center;margin:64px 0 0}
.verse .v{font-size:56px;line-height:1.95;font-weight:500;color:var(--text)}
.verse .br{color:var(--blue);font-size:60px;line-height:0}
.verse .ref{margin-top:14px;font-size:28px;color:var(--muted)}

.note{margin-top:70px;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:44px 52px}
.note .lbl{font-size:28px;color:var(--blue);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.note .lbl::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--lime)}
.note p{font-size:44px;line-height:1.7}
.note .src{font-size:26px;color:var(--muted);margin-top:18px}

.hadith{margin-top:60px;border-inline-start:6px solid var(--lime);padding:16px 44px 20px;background:linear-gradient(270deg,rgba(196,231,115,.07),transparent)}
.hadith p{font-size:52px;line-height:1.85;font-weight:500}
.hadith .ref{font-size:28px;color:var(--muted);margin-top:12px}

.foot{height:120px;display:flex;align-items:center;justify-content:center;font-family:"PlexLat";font-size:26px;color:var(--dim);letter-spacing:.02em;position:relative}
.swipe{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:12px;font-family:"Plex";font-size:24px;color:var(--muted)}
.swipe svg{width:40px;height:40px}
.send{position:absolute;left:0;top:50%;transform:translateY(-55%);width:84px;height:84px}

/* cover */
.cover .body{justify-content:flex-start;padding-top:40px;padding-bottom:40px}
.cover .kicker{font-size:34px;color:var(--lime);font-weight:600;margin-bottom:10px}
.cover h1{font-size:176px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.cover h1 span{color:var(--blue)}
.cover .rule{width:140px;height:6px;background:var(--blue);border-radius:3px;margin:46px 0 46px}
.cover .sub{font-size:50px;line-height:1.7;color:#c9cdd2;font-weight:400}
.ring{position:absolute;left:-250px;bottom:150px;width:600px;height:600px;transform:rotate(180deg)}

.cover h1.ct{font-size:112px;line-height:1.45;font-weight:700}
.cover h1.ct span{font-size:170px;line-height:1.15;color:var(--blue);display:inline-block;margin:6px 0}
.cover h1.ct em{display:block;margin-top:-6px;font-style:normal;font-size:52px;font-weight:500;color:var(--muted)}
.big-q{font-size:200px;line-height:1;color:var(--blue);opacity:.18;font-family:"Plex";position:absolute;top:150px;left:100px}
.ttl{font-size:128px;line-height:1.3;font-weight:700}
.ttl span{color:var(--blue)}
.cards{display:flex;gap:36px;margin-top:50px}
.card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:30px;padding:34px 30px 36px;box-shadow:0 8px 0 0 #08090a;text-align:center}
.card svg{width:100%;height:300px;display:block}
.card .lab{font-size:36px;font-weight:700;margin-top:18px}
.card .sub{font-size:26px;color:var(--muted);margin-top:4px}
.card.off{background:transparent;box-shadow:none;border:1.5px dashed #2f3338}
.card.off .lab{color:var(--muted)}
</style>
</head>
<body>
<section class="slide">
  <div class="body" style="justify-content:center;padding-bottom:30px">
    <div style="width:40px;height:40px;border-radius:50%;background:var(--lime);background-clip:padding-box;border:8px solid rgba(196,231,115,.18);margin:0 0 20px"></div>
    <h1 class="ttl">واصبر <span>نفسك</span></h1>
    <div class="verse" style="text-align:right;margin-top:26px">
      <div class="v" style="font-size:38px;line-height:1.85"><span class="br" style="font-size:44px">﴿</span>وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم<br>بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ<span class="br" style="font-size:44px">﴾</span></div>
      <div class="ref" style="font-size:24px">[سورة الكهف: ٢٨]</div>
    </div>

    <div class="cards">
      <!-- with good company -->
      <div class="card">
        <svg viewBox="0 0 200 210" fill="none">
          <circle cx="100" cy="64" r="56" fill="#65bdd5" fill-opacity=".10"/>
          <!-- companions -->
          <g stroke="#65bdd5" stroke-opacity=".55" stroke-width="2.2" fill="#1b1d20">
            <circle cx="56" cy="52" r="10"/><path d="M40 92 q16 -26 32 0"/>
            <circle cx="144" cy="52" r="10"/><path d="M128 92 q16 -26 32 0"/>
          </g>
          <!-- person -->
          <circle cx="100" cy="40" r="13" fill="#65bdd5"/>
          <path d="M78 96 q22 -38 44 0 z" fill="#65bdd5"/>
          <path d="M66 60 q34 -34 68 0" stroke="#c4e773" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 6"/>
          <!-- battery -->
          <rect x="34" y="128" width="122" height="58" rx="12" stroke="#65bdd5" stroke-width="3"/>
          <rect x="158" y="146" width="8" height="22" rx="3" fill="#65bdd5"/>
          <g fill="#c4e773"><rect x="42" y="136" width="24" height="42" rx="5"/><rect x="70" y="136" width="24" height="42" rx="5"/><rect x="98" y="136" width="24" height="42" rx="5"/><rect x="126" y="136" width="22" height="42" rx="5"/></g>
          <path d="M100 140 L90 158 H101 L96 176 L110 154 H99 Z" fill="#0f1316"/>
        </svg>
        <div class="lab">مع الصحبة الصالحة</div>
        <div class="sub">همّةٌ ومداومةٌ على الخير</div>
      </div>
      <!-- without -->
      <div class="card off">
        <svg viewBox="0 0 200 210" fill="none">
          <circle cx="56" cy="52" r="10" stroke="#5f666d" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 4"/><path d="M40 92 q16 -26 32 0" stroke="#5f666d" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 4"/>
          <circle cx="144" cy="52" r="10" stroke="#5f666d" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 4"/><path d="M128 92 q16 -26 32 0" stroke="#5f666d" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2 4"/>
          <g transform="rotate(-8 100 70)">
            <circle cx="100" cy="46" r="13" fill="#5f666d"/>
            <path d="M78 98 q22 -34 44 0 z" fill="#5f666d"/>
          </g>
          <rect x="34" y="128" width="122" height="58" rx="12" stroke="#5f666d" stroke-width="3"/>
          <rect x="158" y="146" width="8" height="22" rx="3" fill="#5f666d"/>
          <rect x="42" y="136" width="18" height="42" rx="5" fill="#d98b6a"/>
        </svg>
        <div class="lab">بدون الصحبة الصالحة</div>
        <div class="sub">فتورٌ وضعف</div>
      </div>
    </div>
  </div>
  <div class="foot"><span dir="ltr">@abdulla_7amdan</span></div>
</section>
</body>
</html>

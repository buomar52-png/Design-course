*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
body{font-family:"Plex",sans-serif;color:var(--ink);position:relative;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
#land{left:0;top:0}
#grain{inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.16;

#sp img{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:0 0;filter:sepia(.22) saturate(.72) contrast(1.07) brightness(1.02)}
#ring{border-radius:50%;border:6px solid var(--red)}
#ringdot{width:30px;height:30px;background:var(--ink)}

.scene{position:absolute;opacity:0}
.band{position:absolute;background:var(--red);transform-origin:top center}
.line{display:flex;flex-wrap:wrap;justify-content:center;gap:0 .26em;direction:rtl;text-align:center}
.w{display:inline-block;opacity:0}
.acc{color:var(--red)}
.hl{position:relative}
.hl::after{content:"";position:absolute;right:0;left:0;bottom:.02em;height:.075em;background:var(--red);transform-origin:right center;transform:scaleX(var(--p,0))}
.card{background:rgba(238,229,205,.95);border-right:16px solid var(--red);box-shadow:0 30px 60px rgba(26,26,26,.28)}
.pill{display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper);font-weight:600}
.tile{position:absolute;width:210px;height:210px;border:2.5px solid var(--ink);display:grid;place-items:center;opacity:0;background:rgba(238,229,205,.6)}
.tile::before{content:"";position:absolute;top:-9px;right:-9px;width:18px;height:18px;background:var(--red)}
.tile svg{width:150px;height:150px}
.lbl{position:absolute;width:260px;text-align:center;font-size:34px;font-weight:500;color:var(--grey);opacity:0}
svg .s{fill:none;stroke:var(--ink);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
svg .s2{fill:none;stroke:var(--red);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
svg .f{fill:var(--red)}
svg .fl{fill:var(--red);opacity:.22}
.fig{position:absolute;width:12px;height:34px}
#tree{left:0;top:0;mix-blend-mode:multiply}
#handle{left:0;width:1080px;top:1660px;text-align:center}
#handle span{display:inline-block;font-size:32px;font-weight:400;color:var(--grey);letter-spacing:1px;padding:6px 24px;direction:ltr}
.split{position:absolute;left:0;width:1080px;height:3px;background:var(--ink)}
</style>

<script>
const SRC_W=720,SRC_H=1280,FPS=30,LAST_FRAME=562,HZ=1745;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eout=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- المشهد الطبيعي الثابت: الأرض، الأفق، الضباب ---------- */
(function land(){
  const c=document.getElementById('land').getContext('2d'),R=rng(7);
  c.fillStyle='#EEE5CD';c.fillRect(0,0,1080,1920);
  // ضباب رمادي محفور يمين
  const g=c.createLinearGradient(960,0,1080,0);g.addColorStop(0,'rgba(60,58,52,0)');g.addColorStop(1,'rgba(60,58,52,.30)');
  c.fillStyle=g;c.fillRect(940,0,140,HZ);
  c.strokeStyle='rgba(30,30,30,.18)';c.lineWidth=1;
  for(let i=0;i<900;i++){const x=960+R()*120,y=R()*HZ,l=6+R()*16;c.globalAlpha=(x-960)/120;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+l/2,y-3,x+l,y+R()*4-2);c.stroke();}
  c.globalAlpha=1;
  // سهل فاتح فوق الأفق
  c.fillStyle='#E6DCC1';c.fillRect(0,HZ-48,1080,48);
  c.strokeStyle='rgba(26,26,26,.25)';
  for(let i=0;i<260;i++){const x=R()*1080,y=HZ-46+R()*44,l=20+R()*60;c.beginPath();c.moveTo(x,y);c.lineTo(x+l,y+R()-0.5);c.stroke();}
  // الأرض الداكنة
  const gg=c.createLinearGradient(0,0,1080,0);gg.addColorStop(0,'#CFC4A8');gg.addColorStop(.35,'#6d685d');gg.addColorStop(.6,'#1d1d1d');gg.addColorStop(1,'#151515');
  c.fillStyle=gg;c.fillRect(0,HZ,1080,1920-HZ);
  for(let i=0;i<5200;i++){
    const x=R()*1100-10,y=HZ+R()*(1920-HZ),l=5+R()*22,dark=x<420;
    c.strokeStyle=dark?`rgba(26,26,26,${.25+R()*.4})`:`rgba(238,229,205,${.05+R()*.18})`;
    c.lineWidth=.8+R()*.8;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+l/2,y-2-R()*3,x+l,y+R()*3);c.stroke();
  }
  c.fillStyle='#1A1A1A';c.fillRect(0,HZ-1,1080,2);
})();

/* ---------- الشجرة الحبرية ---------- */
const TREE={segs:[],leaves:[]};
(function buildTree(){
  const R=rng(11),T0=18.25,tx=965,top=105;
  const N=36;let px=tx,py=HZ+4;
  const trunkX=y=>{const k=(HZ-y)/(HZ-top);return tx-5*k+Math.sin(k*8)*3;};
  for(let i=1;i<=N;i++){const k=i/N;const ny=lerp(HZ+4,top,k),nx=trunkX(ny)+(R()-.5)*1.5;
    TREE.segs.push({x1:px,y1:py,x2:nx,y2:ny,w:lerp(26,3,Math.pow(k,.75)),t:T0+k*0.55,d:0.06});px=nx;py=ny;}
  function leaf(x,y,t,a,len){const ang=(R()-.5)*1.1,l=len*(0.5+R());
    TREE.leaves.push({x,y,dx:Math.cos(ang)*l,dy:Math.sin(ang)*l,a,w:.8+R()*1.0,t});}
  // طبقات الأغصان يسار الجذع (تاج كثيف مثل الصورة)
  const tiers=17;
  for(let i=0;i<tiers;i++){
    const k=i/(tiers-1);                       // 0 أسفل → 1 أعلى
    const y0=lerp(1060,170,k)+(R()-.5)*24, x0=trunkX(y0);
    const prof=Math.sin(Math.PI*clamp(0.18+k*0.9,0,1));
    let L=lerp(120,400,prof)*(0.85+R()*0.25); L=Math.min(L,x0-565);
    const misty=k<0.14;
    const tt=18.45+k*0.55;
    // الغصن الرئيسي منحنٍ للأعلى قليلًا
    const lift=10+R()*55, steps=8; let cx=x0,cy=y0; const pts=[];
    for(let st=1;st<=steps;st++){const u=st/steps;
      const nx=x0-L*u, ny=y0-lift*Math.sin(u*Math.PI*.6)+(R()-.5)*5+u*u*18;
      TREE.segs.push({x1:cx,y1:cy,x2:nx,y2:ny,w:lerp(misty?4:7,1.4,u),t:tt+u*0.35,d:0.06});cx=nx;cy=ny;pts.push([nx,ny,u]);}
    // أغصان صغيرة
    for(let j=0;j<6;j++){const [bx,by,u]=pts[1+Math.floor(R()*(steps-2))];
      const a=Math.PI*(0.55+R()*0.4)*(R()<.6?1:-0.3), l=20+R()*55;
      TREE.segs.push({x1:bx,y1:by,x2:Math.max(560,bx+Math.cos(a)*l),y2:by-Math.sin(a)*l,w:1.3,t:tt+u*0.35+0.05,d:0.15});}
    // الأوراق: سحابة مسطحة فوق الغصن
    const n=misty?300:950;
    for(let j=0;j<n;j++){const u=0.15+Math.pow(R(),0.8)*0.9; const bx=x0-L*Math.min(1,u);
      const by=y0-lift*Math.sin(Math.min(1,u)*Math.PI*.6)+Math.min(1,u)**2*18;
      const h=(misty?60:125)*(1-Math.abs(u-0.55)*0.9)*(0.4+prof*0.6);
      const ly=by-Math.pow(R(),1.4)*h+R()*10, lx=bx+(R()-.5)*30;
      if(lx<560) continue;
      leaf(lx,ly,tt+Math.min(1,u)*0.35+0.1+R()*0.3,misty?.18+R()*.25:.5+R()*.45,misty?5:6);}
  }
  // أغصان عارية يمين الجذع (رمادية خفيفة)
  for(let i=0;i<14;i++){const k=i/13,y0=lerp(1300,150,k)+(R()-.5)*30,x0=trunkX(y0);
    const a=0.3+R()*0.8,l=50+R()*70;const ex=Math.min(1075,x0+Math.cos(a)*l),ey=y0-Math.sin(a)*l;
    TREE.segs.push({x1:x0,y1:y0,x2:ex,y2:ey,w:2,t:18.5+k*0.5,d:0.2});
    for(let j=0;j<2;j++){const a2=a+(R()-.5)*1.2,l2=20+R()*30;
      TREE.segs.push({x1:ex,y1:ey,x2:Math.min(1078,ex+Math.cos(a2)*l2),y2:ey-Math.sin(a2)*l2,w:1.1,t:18.7+k*0.5,d:0.2});}}
})();
const tctx=document.getElementById('tree').getContext('2d');
function drawTree(t){
  const c=tctx;c.clearRect(0,0,1080,1920);
  if(t<18.2) return;
  c.lineCap='round';c.strokeStyle='#1A1A1A';
  for(const s of TREE.segs){const p=clamp((t-s.t)/s.d);if(p<=0)continue;
    c.lineWidth=s.w;c.beginPath();c.moveTo(s.x1,s.y1);c.lineTo(lerp(s.x1,s.x2,p),lerp(s.y1,s.y2,p));c.stroke();}
  for(const L of TREE.leaves){const p=clamp((t-L.t)/0.3);if(p<=0)continue;
    c.globalAlpha=L.a*p;c.lineWidth=L.w;c.beginPath();c.moveTo(L.x,L.y);c.lineTo(L.x+L.dx,L.y+L.dy);c.stroke();}
  c.globalAlpha=1;
  // قاعدة الجذع
  const bp=clamp((t-18.25)/0.3);if(bp>0){c.fillStyle='#1A1A1A';c.beginPath();c.moveTo(940,HZ+6);c.quadraticCurveTo(958,HZ-40,955,HZ-90*bp);c.lineTo(978,HZ-90*bp);c.quadraticCurveTo(975,HZ-40,1000,HZ+6);c.fill();}
}

/* ---------- حركة المتكلم ---------- */
const K=[
 [0,     0,0,1080,1920,0,   1.50,.5,.50],
 [1.60,  0,0,1080,1920,0,   1.58,.5,.46],
 [2.15,  0,0,1080,960,0,    1.55,.5,.30],
 [7.90,  0,0,1080,960,0,    1.63,.5,.30],
 [8.35,  0,0,1080,0,0,      1.63,.5,.30],
 [12.80, 0,0,1080,0,0,      2.00,.5,.33],
 [13.22, 0,0,1080,1920,0,   2.00,.5,.33],
 [15.30, 0,0,1080,1920,0,   2.10,.5,.33],
 [15.78, 0,960,1080,960,0,  1.55,.5,.30],
 [17.95, 0,960,1080,960,0,  1.62,.5,.30],
 [18.45, 210,520,260,260,130, 0.82,.5,.25],
];
function spState(t){
  if(t<=K[0][0]) return K[0].slice(1);
  for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];
    if(t<=b[0]){const p=eio(clamp((t-a[0])/(b[0]-a[0])));return a.slice(1).map((v,j)=>lerp(v,b[j+1],p));}}
  return K[K.length-1].slice(1);
}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sp=$('#sp'), img=$('#spimg');let curSrc='';

window.render=async function(t){
  let [x,y,w,h,r,s,fx,fy]=spState(t);
  sp.style.left=x+'px';sp.style.top=y+'px';sp.style.width=w+'px';sp.style.height=Math.max(0,h)+'px';sp.style.borderRadius=r+'px';
  sp.style.visibility=h<1?'hidden':'visible';
  const iw=SRC_W*s, ih=SRC_H*s;
  let ix=clamp(w/2-fx*iw,w-iw,0), iy=clamp(h/2-fy*ih,Math.min(0,h-ih),0);
  img.style.transform=`translate(${ix}px,${iy}px) scale(${s})`;
  const fr=Math.min(LAST_FRAME,Math.floor(t*FPS)+1);
  const src='sp/'+String(fr).padStart(4,'0')+'.jpg';
  if(src!==curSrc){curSrc=src;img.src=src;await img.decode();}
  const rp=eout(clamp((t-18.35)/0.4));
  $('#ring').style.cssText=`left:${x-12}px;top:${y-12}px;width:${w+24}px;height:${h+24}px;opacity:${rp};transform:scale(${0.9+0.1*rp})`;
  $('#ringdot').style.cssText=`left:${x+w*0.80}px;top:${y+h*0.80}px;opacity:${clamp((t-18.6)/0.1)};transform:scale(${back(clamp((t-18.6)/0.35))})`;

  for(const sc of $$('.scene')){
    const pin=clamp((t-(+sc.dataset.in))/0.25), pout=clamp((t-(+sc.dataset.out))/0.35);
    sc.style.opacity=pin*(1-pout);
    sc.style.filter=pout>0?`blur(${pout*16}px)`:'none';
    sc.style.transform=pout>0?`translateY(${-pout*30}px)`:'none';
  }
  for(const el of $$('.band')){const p=eio(clamp((t-(+el.dataset.t))/(+el.dataset.d)));el.style.transform=`scaleY(${p})`;}
  for(const el of $$('.w')){
    const p=eout(clamp((t-(+el.dataset.t)+0.06)/0.42));
    el.style.opacity=p;el.style.filter=p<1?`blur(${(1-p)*12}px)`:'none';el.style.transform=`translateY(${(1-p)*24}px)`;
    if(el.dataset.hl) el.style.setProperty('--p',eout(clamp((t-(+el.dataset.hl))/0.45)));
  }
  for(const el of $$('.tile,.lbl')){
    const p=clamp((t-(+el.dataset.t))/0.5);
    el.style.opacity=clamp(p*2.2);
    el.style.transform=`scale(${p>0?back(p)*0.25+0.75:0.75}) translateY(${(1-eout(p))*20}px)`;
  }
  for(const el of $$('.pop')){const p=clamp((t-(+el.dataset.t))/0.4);
    el.style.transformBox='fill-box';el.style.transformOrigin='center';el.style.transform=`scale(${p>0?back(p):0})`;}
  for(const el of $$('.draw')){const p=eio(clamp((t-(+el.dataset.t))/(+el.dataset.d)));
    el.style.strokeDasharray='1 1';el.style.strokeDashoffset=1-p;el.style.opacity=p>0?1:0;}
  // الشخص الصغير في الخاتمة يمشي خطوة
  $('#fig6').style.transform=`translateX(${-clamp((t-18.5)/3)*40}px)`;
  drawTree(t);
  const fp=clamp((t-20.6)/0.9), bob=t>21.5?Math.sin((t-21.5)*3)*4:0;
  $('#planeG').style.transform=`translate(${Math.sin(fp*Math.PI)*10}px,${-Math.sin(fp*Math.PI)*10+bob}px)`;
  const hd=$('#handle span'), overSp=(y<1680&&y+h>1680)?1:0;
  hd.style.background=`rgba(238,229,205,${overSp*0.9})`;
  $('#handle').style.opacity=1-clamp((t-17.9)/0.4);
  $('#grain').style.backgroundPosition=`${(Math.floor(t*15)*137)%360}px ${(Math.floor(t*15)*251)%360}px`;
};
window.ready=document.fonts.ready.then(()=>window.render(0));

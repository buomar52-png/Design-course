:root{
  --bg:#F7F3ED;        /* عاجي دافئ */
  --ink:#1D1F33;       /* حبر كحلي */
  --muted:#77748C;
  --faint:#A9A5B8;
  --indigo:#4045A0;    /* نيلي */
  --indigo-soft:rgba(64,69,160,.10);
  --amber:#E7A33E;     /* زعفراني */
  --amber-soft:rgba(231,163,62,.30);
  --peach:#F6D3B3;
  --lav:#D8D5F2;
  --card:rgba(250,247,242,.90);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:"Plex",sans-serif;color:var(--ink);position:relative;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
#bg{inset:0;background:var(--bg);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(120px)}
#b1{width:900px;height:900px;background:var(--peach);right:-420px;top:-380px;opacity:.85}
#b2{width:1000px;height:1000px;background:var(--lav);left:-520px;bottom:-480px;opacity:.9}
#b3{width:520px;height:520px;background:#F3E3C6;left:-200px;top:520px;opacity:.45}
#dot{left:972px;top:238px;width:26px;height:26px;border-radius:50%;background:var(--amber)}
#halo{left:945px;top:211px;width:80px;height:80px;border-radius:50%;background:var(--amber-soft)}

#sp{overflow:hidden;left:0;top:0;width:1080px;height:1920px;background:#8a837c}
#sp img{position:absolute;left:0;top:0;width:720px;height:1280px;transform-origin:0 0}
#ring{border-radius:50%;border:7px solid var(--indigo);box-shadow:0 0 0 14px rgba(64,69,160,.10)}
#ringdot{width:46px;height:46px;border-radius:50%;background:var(--amber);border:7px solid var(--bg)}

.scene{position:absolute;opacity:0}
.line{display:flex;flex-wrap:wrap;justify-content:center;gap:0 .26em;direction:rtl;text-align:center}
.w{display:inline-block;opacity:0;will-change:transform,filter,opacity}
.acc{color:var(--indigo)}
.amb{color:var(--amber)}
.hl{position:relative;z-index:0}
.hl::before{content:"";position:absolute;z-index:-1;right:-.12em;left:-.12em;bottom:.08em;height:.42em;background:var(--amber-soft);border-radius:.12em;transform-origin:right center;transform:scaleX(var(--p,0))}
.card{background:var(--card);border-radius:44px;box-shadow:0 30px 70px rgba(29,31,51,.18)}
.pill{display:inline-flex;align-items:center;justify-content:center;background:var(--indigo);color:#fff;border-radius:999px;font-weight:600}
.tile{position:absolute;width:210px;height:210px;border-radius:44px;background:#fff;border:3px solid rgba(231,163,62,.55);box-shadow:0 18px 40px rgba(64,69,160,.12);display:grid;place-items:center;opacity:0}
.tile svg{width:150px;height:150px}
.lbl{position:absolute;width:260px;text-align:center;font-size:36px;font-weight:500;color:var(--muted);opacity:0}
svg .s{fill:none;stroke:var(--indigo);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
svg .s2{fill:none;stroke:var(--amber);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
svg .f{fill:var(--amber);opacity:.85}
svg .fl{fill:var(--amber);opacity:.35}
#handle{left:0;width:1080px;top:1666px;text-align:center}
#handle span{display:inline-block;font-size:34px;font-weight:400;color:var(--faint);letter-spacing:.5px;padding:8px 26px;border-radius:999px;direction:ltr}
</style>

<script>
const W=1080,H=1920,SRC_W=720,SRC_H=1280,FPS=30,LAST_FRAME=562;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eout=x=>1-Math.pow(1-x,3);
const back=x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;

// keyframes للمتكلم: t, x,y,w,h,r, s(scale), fx,fy (focus)
const K=[
 [0,     0,0,1080,1920,0,   1.50,.5,.50],
 [1.60,  0,0,1080,1920,0,   1.58,.5,.46],
 [2.15,  0,0,1080,960,0,    1.55,.5,.30],
 [7.90,  0,0,1080,960,0,    1.63,.5,.30],
 [8.35,  0,0,1080,0,0,      1.63,.5,.30],
 [12.80, 0,0,1080,0,0,      2.00,.5,.33],
 [13.22, 0,0,1080,1920,0,   2.00,.5,.33],
 [15.30, 0,0,1080,1920,0,   2.10,.5,.33],
 [15.78, 0,960,1080,960,0,  1.55,.5,.30],
 [17.95, 0,960,1080,960,0,  1.62,.5,.30],
 [18.45, 390,500,300,300,150, 0.92,.5,.25],
];
function spState(t){
  if(t<=K[0][0]) return K[0].slice(1);
  for(let i=0;i<K.length-1;i++){
    const a=K[i],b=K[i+1];
    if(t<=b[0]){const p=eio(clamp((t-a[0])/(b[0]-a[0])));return a.slice(1).map((v,j)=>lerp(v,b[j+1],p));}
  }
  return K[K.length-1].slice(1);
}
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sp=$('#sp'), img=$('#spimg');
let curSrc='';

window.render=async function(t){
  // الخلفية
  $('#b1').style.transform=`translate(${Math.sin(t*.35)*40}px,${Math.cos(t*.3)*30}px)`;
  $('#b2').style.transform=`translate(${Math.cos(t*.28)*50}px,${Math.sin(t*.32)*40}px)`;
  $('#b3').style.transform=`translate(${Math.sin(t*.22)*60}px,${Math.cos(t*.25)*50}px)`;
  const pulse=(t*0.9)%1;
  $('#halo').style.transform=`scale(${0.6+pulse*0.9})`;$('#halo').style.opacity=1-pulse;

  // المتكلم
  let [x,y,w,h,r,s,fx,fy]=spState(t);
  sp.style.left=x+'px';sp.style.top=y+'px';sp.style.width=w+'px';sp.style.height=Math.max(0,h)+'px';sp.style.borderRadius=r+'px';
  sp.style.visibility=h<1?'hidden':'visible';
  const iw=SRC_W*s, ih=SRC_H*s;
  let ix=w/2-fx*iw, iy=h/2-fy*ih;
  ix=clamp(ix,w-iw,0); iy=clamp(iy,Math.min(0,h-ih),0);
  img.style.transform=`translate(${ix}px,${iy}px) scale(${s})`;
  const fr=Math.min(LAST_FRAME,Math.floor(t*FPS)+1);
  const src='sp/'+String(fr).padStart(4,'0')+'.jpg';
  if(src!==curSrc){curSrc=src;img.src=src;await img.decode();}
  // حلقة الصورة الرمزية
  const rp=eout(clamp((t-18.35)/0.4));
  $('#ring').style.cssText=`left:${x-10}px;top:${y-10}px;width:${w+20}px;height:${h+20}px;opacity:${rp};transform:scale(${0.9+0.1*rp})`;
  const dp=back(clamp((t-18.6)/0.35));
  $('#ringdot').style.cssText=`left:${x+w*0.82}px;top:${y+h*0.78}px;opacity:${clamp((t-18.6)/0.1)};transform:scale(${dp})`;

  // المشاهد
  for(const sc of $$('.scene')){
    const tin=+sc.dataset.in,tout=+sc.dataset.out;
    const pin=clamp((t-tin)/0.25), pout=clamp((t-tout)/0.35);
    sc.style.opacity=pin*(1-pout);
    sc.style.filter=pout>0?`blur(${pout*16}px)`:'none';
    sc.style.transform=pout>0?`translateY(${-pout*30}px)`:'none';
  }
  // الكلمات
  for(const el of $$('.w')){
    const p=eout(clamp((t-(+el.dataset.t)+0.06)/0.42));
    el.style.opacity=p;
    el.style.filter=p<1?`blur(${(1-p)*14}px)`:'none';
    el.style.transform=`translateY(${(1-p)*26}px)`;
    if(el.dataset.hl){el.style.setProperty('--p',eout(clamp((t-(+el.dataset.hl))/0.45)));}
  }
  for(const el of $$('.tile,.lbl')){
    const p=clamp((t-(+el.dataset.t))/0.5);
    el.style.opacity=clamp(p*2.2);
    el.style.transform=`scale(${p>0?back(p)*0.25+0.75:0.75}) translateY(${(1-eout(p))*20}px)`;
  }
  for(const el of $$('.pop')){
    const p=clamp((t-(+el.dataset.t))/0.4);
    el.style.transformBox='fill-box';el.style.transformOrigin='center';
    el.style.transform=`scale(${p>0?back(p):0})`;
  }
  for(const el of $$('.draw')){
    const p=eio(clamp((t-(+el.dataset.t))/(+el.dataset.d)));
    el.style.strokeDasharray='1 1';el.style.strokeDashoffset=1-p;
    el.style.opacity=p>0?1:0;
  }
  // تحليق طائرة النشر
  const fp=clamp((t-20.6)/0.9);
  const bob=t>21.5?Math.sin((t-21.5)*3)*4:0;
  $('#planeG').style.transform=`translate(${Math.sin(fp*Math.PI)*10}px,${-Math.sin(fp*Math.PI)*10+bob}px)`;

  // اسم الحساب السفلي
  const hd=$('#handle span');
  const overSp=(y<1690&&y+h>1690)?1:0;
  hd.style.background=`rgba(250,247,242,${overSp*0.82})`;
  hd.style.color=overSp?'#77748C':'#A9A5B8';
  $('#handle').style.opacity=1-clamp((t-17.9)/0.4);
};
window.ready=document.fonts.ready.then(()=>window.render(0));
</script>
</body>
</html>
